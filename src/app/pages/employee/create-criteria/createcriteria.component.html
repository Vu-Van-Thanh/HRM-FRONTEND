<mat-card class="mt-3 p-3">
  <h2 mat-card-title>{{ isEditMode ? 'Chỉnh sửa Tiêu chí' : 'Tạo Tiêu chí Mới' }}</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Tên tiêu chí</mat-label>
      <input matInput formControlName="name" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Mô tả</mat-label>
      <textarea matInput formControlName="description" rows="3"></textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Trọng số</mat-label>
      <input matInput type="number" formControlName="weight" min="1" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-100 mb-3">
      <mat-label>Phân loại</mat-label>
      <input matInput formControlName="category" />
    </mat-form-field>

    <div class="mt-3">
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid">
        {{ isEditMode ? 'Lưu thay đổi' : 'Tạo mới' }}
      </button>
    </div>
    
  </form>
</mat-card>
